name: Update Bio and Website Tagline

on:
  schedule:
    - cron: '0 0 * * *'  # Runs at midnight UTC every day
  workflow_dispatch:     # Allows manual trigger from GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run update script
        id: update_script
        run: python update_github_bio.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          WEBSITE_REPO: ${{ secrets.WEBSITE_REPO }}
        continue-on-error: true

      - name: Check if script succeeded
        if: steps.update_script.outcome == 'failure'
        run: |
          echo "❌ Update script failed!"
          exit 1

      # Notify on failure - GitHub will send email to workflow owner
      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = '⚠️ Bio/Website Update Failed';
            const body = `The scheduled bio and website tagline update failed.

            **Run Details:**
            - Workflow: ${context.workflow}
            - Run ID: ${context.runId}
            - Run URL: ${context.payload.repository.html_url}/actions/runs/${context.runId}

            **Common Causes:**
            - Expired GH_TOKEN (check if token needs renewal)
            - API rate limits
            - Repository access issues

            **Action Required:**
            1. Check the [workflow run logs](${context.payload.repository.html_url}/actions/runs/${context.runId})
            2. Verify GH_TOKEN is valid and has proper scopes (user:email, repo)
            3. Update the token if expired

            This issue will be automatically closed when the next run succeeds.`;

            // Check if an issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated-alert,workflow-failure'
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['automated-alert', 'workflow-failure']
              });
            } else {
              // Update existing issue with new run info
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `Another failure occurred. [View run logs](${context.payload.repository.html_url}/actions/runs/${context.runId})`
              });
            }

      # Close notification issue on success
      - name: Close Notification Issue on Success
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated-alert,workflow-failure'
            });

            for (const issue of issues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ Workflow is now running successfully. Closing this alert.'
              });
            }
